<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2620">
<title>Vorratskeller</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
  <header>
    <div class="eyebrow">Keller · Reserve</div>
    <h1>Vorratskeller</h1>
    <div class="subtitle" id="subtitle">Lade Bestand …</div>
  </header>

  <div class="list" id="list"></div>

  <div class="fab-row">
    <button class="fab" id="btnAdd">+ Artikel hinzufügen</button>
    <button class="fab-scan" id="btnScan" aria-label="Barcode scannen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3"/>
        <path d="M4 12h16" stroke-dasharray="1.5 2"/>
      </svg>
    </button>
  </div>
</div>

<!-- Sheet: Artikel hinzufügen / bearbeiten -->
<div class="sheet-overlay" id="addForm">
  <div class="sheet">
    <h2 id="addFormTitle">Neuer Artikel</h2>
    <label>Name</label>
    <input id="newName" placeholder="z. B. Spülmaschinentabs" />
    <label>Menge</label>
    <input id="newQty" type="number" inputmode="numeric" placeholder="0" />
    <label>Einheit</label>
    <input id="newUnit" placeholder="z. B. Rollen, Flaschen, Stück" />
    <label>Mindestbestand (Warnung ab)</label>
    <input id="newMin" type="number" inputmode="numeric" placeholder="0" />
    <input type="hidden" id="newBarcode" />
    <input type="hidden" id="editId" />
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancelAdd">Abbrechen</button>
      <button class="btn-save" id="btnSaveItem">Speichern</button>
    </div>
  </div>
</div>

<!-- Sheet: Löschen bestätigen -->
<div class="sheet-overlay" id="deleteForm">
  <div class="sheet">
    <h2>Artikel löschen</h2>
    <div class="confirm-body">Soll <strong id="delName"></strong> wirklich aus der Liste entfernt werden?</div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancelDelete">Abbrechen</button>
      <button class="btn-danger" id="btnConfirmDelete">Löschen</button>
    </div>
  </div>
</div>

<!-- Sheet: Barcode scannen -->
<div class="sheet-overlay" id="scanForm">
  <div class="sheet">
    <h2>Barcode scannen</h2>
    <div class="scan-view">
      <div class="scan-frame" id="scanFrame">
        <video id="scanVideo" playsinline muted></video>
      </div>
      <div class="scan-status" id="scanStatus">Kamera wird gestartet …</div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancelScan">Abbrechen</button>
    </div>
  </div>
</div>

<!-- ZXing für Barcode-Erkennung (rein clientseitig, kein Server) -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="js/db.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
